schema_version: 1

project:
  name: "집밥노트"
  slug: "jipbab-note"
  platforms:
    - "web"
    - "capacitor-ios"
    - "capacitor-android"
    - "cloudflare-workers"
  owner: "me"
  release_goal: "초보 사용자가 냉장고 재료에서 레시피 추천과 장보기까지 이어갈 수 있는 앱을 스토어 제출 가능한 상태로 만든다."

candidate:
  phase: "appstore_remote_webview_production_updated"
  version: "1.0"
  build_number: "2026062602"
  git_sha: "ae9bd02"
  branch: "ux/home-today-action-v2"
  dirty_state: "committed_to_feature_branch"
  source_of_truth: "docs/current-release-state.md, docs/real-device-qa.md"

local_checks:
  - name: "Local release gates"
    command: "pnpm release:check"
    status: "documented_pass"
    evidence: "docs/current-release-state.md"
  - name: "Release security gate"
    command: "pnpm release:security-check"
    status: "documented_pass"
    evidence: "docs/current-release-state.md"
  - name: "Store submit gate"
    command: "pnpm release:submit-gate"
    status: "documented_blocked"
    evidence: "docs/current-release-state.md"
  - name: "App Store review packet"
    command: "pnpm release:capture-appstore-review-packet"
    status: "released_ready_for_sale"
    evidence: "output/release-evidence/2026-06-28T01-08-06-521Z-appstore-review-preflight/summary.md"

runtime_checks:
  - name: "App Store remote WebView production UX update"
    target: "https://jipbab-note-app.vercel.app"
    status: "deployed_verified"
    command: "vercel deploy --prod --yes"
    evidence: "output/ui-evidence/shopping-production-vercel-cdp-390.png"
  - name: "iOS real-device QA"
    target: "iPhone"
    status: "confirmed_appstore_scope"
    evidence: "docs/real-device-qa.md"
  - name: "iOS cable QA evidence"
    target: "iPhone 12 Pro over USB/CoreDevice"
    status: "confirmed_cable_only"
    command: "pnpm check:ios-cable-qa"
    evidence: "output/release-evidence/2026-06-25T00-16-cable-ios-qa/summary.md"
  - name: "iOS cable XCUITest primary-tab smoke"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed_primary_tabs_only"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testCableLaunchAndPrimaryTabs"
    evidence: "output/release-evidence/2026-06-25T09-30-ios-xcuitest-cable-smoke/summary.md"
  - name: "iOS cable XCUITest recipe-to-shopping core loop"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testCoreLoopRecipeRecommendationToShoppingList"
    evidence: "output/release-evidence/2026-06-25T09-30-ios-xcuitest-cable-smoke/summary.md"
  - name: "iOS cable XCUITest shopping external-link handoff"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testShoppingExternalLinkHandoff"
    evidence: "output/release-evidence/2026-06-25T09-30-ios-xcuitest-cable-smoke/summary.md"
  - name: "iOS cable XCUITest local notification preparation"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testNotificationPreparationFromSettings"
    evidence: "output/release-evidence/2026-06-25T09-30-ios-xcuitest-cable-smoke/summary.md"
  - name: "iOS cable XCUITest OAuth completion probes"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed_google_apple_kakao_user_owned"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testOAuthProviderCompletionProbe|testAppleOAuthProviderCompletionProbe|testKakaoOAuthProviderCompletionProbe"
    evidence: "output/release-evidence/2026-06-25T13-00-ios-native-bridge-oauth-rerun/summary.md"
  - name: "iOS Kakao provider-start"
    target: "iPhone 16 Pro over iPhone Mirroring"
    status: "provider_start_confirmed_login_completion_user_owned"
    command: "manual iPhone Mirroring QA"
    evidence: "output/release-evidence/2026-06-26T08-40-kakao-mirroring-provider-start/summary.md"
  - name: "iOS Kakao open-callback completion fix"
    target: "Vercel Production and iPhone 16 Pro over iPhone Mirroring"
    status: "deployed_post_deploy_retest_blocked_by_mirroring_lock"
    command: "vercel --prod --yes"
    evidence: "output/release-evidence/2026-06-26T09-20-kakao-open-callback-fix/summary.md"
  - name: "iOS OAuth browserFinished race fix"
    target: "Vercel Production and iOS WebView runtime"
    status: "deployed_retested_superseded_by_native_oauth"
    command: "vercel deploy --prod --yes"
    evidence: "output/release-evidence/2026-06-25T11-05-ios-oauth-race-fix/summary.md"
  - name: "iOS native ASWebAuthenticationSession OAuth rerun"
    target: "iPhone 12 Pro over USB/XCTest"
    status: "confirmed_google_apple_after_https_bridge"
    command: "xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination id=00008101-000525241EE3003A -only-testing:AppReleaseSmokeUITests/AppReleaseSmokeUITests/testOAuthProviderCompletionProbe|testAppleOAuthProviderCompletionProbe"
    evidence: "output/release-evidence/2026-06-25T13-00-ios-native-bridge-oauth-rerun/summary.md"
  - name: "iOS direct account deletion"
    target: "TestFlight iPhone via operator screenshots"
    status: "confirmed_completed_operator_executed"
    command: "manual operator QA"
    evidence: "output/release-evidence/2026-06-26T13-56-ios-account-delete-completed/summary.md"
  - name: "App Store screenshot refresh"
    target: "App Store Connect iPhone 6.9 screenshot set"
    status: "confirmed_uploaded_complete_public_html_cdn_current"
    command: "APP_STORE_CONNECT_BUILD_VERSION=2026062602 node scripts/upload-appstore-screenshots.mjs --execute --delete-existing-after-upload"
    evidence: "output/release-evidence/2026-06-29T17-38-appstore-public-screenshot-check/summary.md"
  - name: "Android real-device QA"
    target: "Android physical device"
    status: "partial_not_confirmed"
    evidence: "docs/real-device-qa.md"
  - name: "Cloudflare live home"
    target: "Cloudflare Worker"
    status: "documented_pass"
    evidence: "docs/current-release-state.md"

