name: Toddler Meals CI

on:
  push:
    branches:
      - 'feat/toddler-meals**'
  pull_request:
    paths:
      - 'app/toddler-meals/**'
      - 'components/child-meals/**'
      - 'components/home/CompactFridgeIngredientGrid.tsx'
      - 'components/home/StarterActionCard.tsx'
      - 'content/child-meals/**'
      - 'hooks/useChildMeal**'
      - 'lib/child-meals/**'
      - 'lib/home-fridge-preview.ts'
      - 'scripts/validate-child-recipes.mjs'
      - 'supabase/migrations/20260712*.sql'
      - 'supabase/rollbacks/20260712*.sql'
      - 'tests/child-*.test.ts'
      - 'tests/home-fridge-preview-contract.test.ts'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: toddler-meals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate toddler recipe content
        id: content
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm child-content:validate 2>&1 | tee child-content.log

      - name: Run unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee unit-tests.log

      - name: Type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee production-build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toddler-meals-verification-${{ github.run_id }}
          path: |
            child-content.log
            unit-tests.log
            typecheck.log
            production-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce verification result
        if: always()
        env:
          CONTENT_OUTCOME: ${{ steps.content.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'content=%s\nunit=%s\ntypecheck=%s\nbuild=%s\n' \
            "$CONTENT_OUTCOME" "$UNIT_OUTCOME" "$TYPECHECK_OUTCOME" "$BUILD_OUTCOME"
          test "$CONTENT_OUTCOME" = success
          test "$UNIT_OUTCOME" = success
          test "$TYPECHECK_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
