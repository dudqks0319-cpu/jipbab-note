name: Release Gate

on:
  push:
    branches:
      - main
      - integration/**
      - release/**
  pull_request:
    branches:
      - main
      - integration/**
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verification Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      test: ${{ steps.test.outcome }}
      integration: ${{ steps.integration.outcome }}
      content: ${{ steps.content.outcome }}
      build: ${{ steps.build.outcome }}
      browser_negative: ${{ steps.browser_negative.outcome }}
      browser_happy: ${{ steps.browser_happy.outcome }}
      security: ${{ steps.security.outcome }}
      static: ${{ steps.static.outcome }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com
      NEXT_PUBLIC_SITE_URL: https://jipbab-note-app.vercel.app
      NEXT_PUBLIC_API_BASE_URL: https://jipbab-note-app.vercel.app
      CAPACITOR_SERVER_URL: https://jipbab-note-app.vercel.app
      NEXT_PUBLIC_COMMUNITY_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: google,apple,kakao
      NEXT_PUBLIC_SUPABASE_OAUTH_GOOGLE_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_OAUTH_KAKAO_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_OAUTH_APPLE_ENABLED: "true"
      KAKAO_ACCOUNT_EMAIL_PERMISSION_CONFIRMED: "true"
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test

      - name: Integration tests
        id: integration
        continue-on-error: true
        run: pnpm test:integration

      - name: Content tests
        id: content
        continue-on-error: true
        run: pnpm test:content

      - name: Build
        id: build
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
        run: pnpm build

      - name: Phase 6 browser negative path
        id: browser_negative
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm capture:phase6-e2e-negative

      - name: Phase 6 browser happy path
        id: browser_happy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm capture:phase6-e2e-happy

      - name: Upload Phase 6 browser evidence
        if: always()
        # actions/upload-artifact v6.0.0
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase6-browser-evidence-${{ github.sha }}
          path: output/ui-evidence/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 90 || 14 }}

      - name: CI static release gates
        id: static
        continue-on-error: true
        run: pnpm release:ci-static-check

      - name: Security release gates
        id: security
        continue-on-error: true
        run: pnpm release:security-check

      - name: Goal completion status
        run: pnpm release:goal-report

  code-test:
    name: Code Quality / Test
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.test }}
        run: test "$STAGE_OUTCOME" = "success"

  code-integration:
    name: Code Quality / Integration
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.integration }}
        run: test "$STAGE_OUTCOME" = "success"

  content-validation:
    name: Content / Recipe Validation
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.content }}
        run: test "$STAGE_OUTCOME" = "success"

  next-build:
    name: Build / Next Production
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.build }}
        run: test "$STAGE_OUTCOME" = "success"

  browser-negative:
    name: Browser / Negative
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.browser_negative }}
        run: test "$STAGE_OUTCOME" = "success"

  browser-happy:
    name: Browser / Happy Fixture
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.browser_happy }}
        run: test "$STAGE_OUTCOME" = "success"

  security-release:
    name: Security / Release
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.security }}
        run: test "$STAGE_OUTCOME" = "success"

  static-release:
    name: Release / Static Gates
    needs: verification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage
        env:
          STAGE_OUTCOME: ${{ needs.verification.outputs.static }}
        run: test "$STAGE_OUTCOME" = "success"
