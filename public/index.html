<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>집밥노트</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f6fff8 0%, #fff8f3 100%);
        color: #4b5563;
      }
      .card {
        width: min(420px, calc(100vw - 40px));
        margin: 24px;
        padding: 24px 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #e7faf0;
        color: #159570;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
        color: #1f2937;
      }
      .desc {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .status {
        margin-top: 18px;
        font-size: 13px;
        color: #6b7280;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      button,
      a.button {
        appearance: none;
        border: 0;
        text-decoration: none;
        cursor: pointer;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
      }
      .primary {
        background: #31c48d;
        color: white;
      }
      .secondary {
        background: #f3f4f6;
        color: #4b5563;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="badge">JIPBAB NOTE</div>
      <h1 class="title">집밥노트 불러오는 중</h1>
      <p class="desc">
        냉장고 재료와 추천 레시피를 연결하는 화면을 준비하고 있습니다.
      </p>
      <p id="status" class="status">원격 앱 연결을 확인하는 중입니다.</p>
      <div class="actions">
        <button id="retry" type="button" class="primary hidden">다시 시도</button>
        <a
          id="support"
          class="button secondary hidden"
          href="mailto:dudqks0319@gmail.com?subject=%EC%A7%91%EB%B0%A5%EB%85%B8%ED%8A%B8%20%EC%97%B0%EA%B2%B0%20%EB%AC%B8%EC%9D%98"
        >문의하기</a>
      </div>
    </section>

    <script>
      const statusNode = document.getElementById("status");
      const retryButton = document.getElementById("retry");
      const supportLink = document.getElementById("support");

      async function loadRuntimeConfig() {
        const response = await fetch("./runtime-app-config.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("runtime-app-config.json 로드 실패");
        }
        return response.json();
      }

      async function bootstrap() {
        try {
          const config = await loadRuntimeConfig();
          const remoteUrl = typeof config.remoteUrl === "string" ? config.remoteUrl.trim() : "";

          if (!remoteUrl) {
            statusNode.textContent = "원격 앱 URL이 설정되지 않아 로컬 안내 화면을 보여주고 있습니다.";
            retryButton.classList.remove("hidden");
            supportLink.classList.remove("hidden");
            return;
          }

          statusNode.textContent = "원격 앱으로 연결합니다.";
          window.location.replace(remoteUrl);
        } catch (_error) {
          statusNode.textContent = "앱 연결에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해 주세요.";
          retryButton.classList.remove("hidden");
          supportLink.classList.remove("hidden");
        }
      }

      retryButton.addEventListener("click", () => {
        retryButton.classList.add("hidden");
        statusNode.textContent = "다시 연결을 시도하는 중입니다.";
        bootstrap();
      });

      bootstrap();
    </script>
  </body>
</html>
