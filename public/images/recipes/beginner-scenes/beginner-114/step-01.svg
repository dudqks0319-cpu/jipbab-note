    <rect x="575" y="154" width="585" height="480" rx="22" fill="#fffdf8" stroke="#e7d3bb"/>
    <circle cx="630" cy="218" r="33" fill="#ef8f37"/>
    <text x="630" y="229" text-anchor="middle" font-size="36" font-weight="950" fill="#fff">1</text>
    <text x="685" y="229" font-size="38" font-weight="950" fill="#5e3414">물기 닦기</text>
    <text x="626" y="300" font-size="31" font-weight="850" fill="#241c17">햄, 두부 표면의 물기를 닦고 굽기 좋은</text>
<text x="626" y="344.95" font-size="31" font-weight="850" fill="#241c17"> 두께로 준비합니다.</text>
    <rect x="626" y="515" width="210" height="46" rx="16" fill="#fff3df" stroke="#e4cba7"/>
    <text x="731" y="546" text-anchor="middle" font-size="22" font-weight="950" fill="#6a4128">불 없음 · 3분</text>
    <rect x="858" y="515" width="210" height="46" rx="16" fill="#f3faec" stroke="#d8e8c9"/>
    <text x="963" y="546" text-anchor="middle" font-size="22" font-weight="950" fill="#4d7a37">초보 확인</text>

    <rect x="40" y="665" width="360" height="82" rx="18" fill="#f3faec" stroke="#d8e8c9"/>
    <text x="68" y="697" font-size="20" font-weight="950" fill="#4d7a37">체크 포인트</text>
    <text x="68" y="727" font-size="18" font-weight="800" fill="#49643d">팬에 올렸을 때 물이 튀지 않을 정도로 표면이 마르면 됩니다.</text>
    <rect x="420" y="665" width="360" height="82" rx="18" fill="#fff7df" stroke="#e4cba7"/>
    <text x="448" y="697" font-size="20" font-weight="950" fill="#a14a25">주의</text>
    <text x="448" y="727" font-size="18" font-weight="800" fill="#6a4128">물기가 많으면 기름이 튀고 겉면이 늦게 익습니다.</text>
    <rect x="800" y="665" width="360" height="82" rx="18" fill="#fff0ee" stroke="#f0c6bf"/>
    <text x="828" y="697" font-size="20" font-weight="950" fill="#c63421">망했어요?</text>
    <text x="828" y="727" font-size="18" font-weight="800" fill="#6b3028">키친타월이 없으면 체에 2분만 받쳐 두세요.</text>
  </g>
