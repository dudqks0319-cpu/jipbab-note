<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">감자국 1단계. 국물 시작</title>
  <desc id="desc">감자국 레시피는 15분 안에 만들 수 있는 초보자용 집밥 메뉴입니다. 1단계. 국물 시작 장면 이미지입니다. 외부 사진, 브랜드, 캐릭터를 사용하지 않은 집밥노트 자체 제작 SVG입니다.</desc>
  <defs>
    <radialGradient id="warmBg" cx="50%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fff0e6"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5b3219" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#warmBg)"/>
  <rect x="14" y="14" width="1172" height="872" rx="20" fill="#fffdf8" opacity="0.88" stroke="#e6cda8"/>
  
  <g>
    <rect x="42" y="34" width="108" height="66" rx="20" fill="#df321c"/>
    <path d="M143 68 L171 52 L171 84 Z" fill="#df321c"/>
    <text x="96" y="78" text-anchor="middle" font-size="34" font-weight="950" fill="#fff">4/7</text>
  </g>

  <text x="600" y="74" text-anchor="middle" font-size="46" font-weight="950" fill="#1e1510">1단계. 국물 시작</text>
  <text x="600" y="118" text-anchor="middle" font-size="24" font-weight="850" fill="#d94324">감자국 조리순서입니다.</text>
  <g fill="#551d12" opacity="0.96">
    <rect x="40" y="154" width="500" height="480" rx="22" fill="#fffaf3" stroke="#e7d3bb"/>
    <g transform="translate(290 380) scale(0.9)">
      
    <g transform="translate(0 0) scale(0.88)" filter="url(#softShadow)">
      <ellipse cx="0" cy="118" rx="250" ry="58" fill="#4b2b1e" opacity="0.16"/>
      <ellipse cx="0" cy="20" rx="255" ry="155" fill="#1e1b19"/>
      <ellipse cx="0" cy="5" rx="218" ry="124" fill="#fff4d9"/>
      <ellipse cx="0" cy="8" rx="196" ry="103" fill="#d94324" opacity="0.92"/>
      
      
      <circle cx="55.0" cy="0.0" r="10" fill="#f7f0dc" opacity="0.76"/><circle cx="71.1" cy="15.7" r="13" fill="#551d12" opacity="0.76"/><circle cx="70.0" cy="38.2" r="16" fill="#d33b21" opacity="0.76"/><circle cx="46.3" cy="25.9" r="19" fill="#7cbf62" opacity="0.76"/><circle cx="0.0" cy="41.0" r="10" fill="#d33b21" opacity="0.76"/><circle cx="-29.5" cy="49.9" r="13" fill="#f7f0dc" opacity="0.76"/><circle cx="-70.0" cy="19.8" r="16" fill="#7cbf62" opacity="0.76"/><circle cx="-111.8" cy="15.7" r="19" fill="#551d12" opacity="0.76"/><circle cx="-55.0" cy="0.0" r="10" fill="#d33b21" opacity="0.76"/><circle cx="-71.1" cy="-10.7" r="13" fill="#7cbf62" opacity="0.76"/><circle cx="-70.0" cy="-29.0" r="16" fill="#f7f0dc" opacity="0.76"/><circle cx="-46.3" cy="-49.9" r="19" fill="#551d12" opacity="0.76"/><circle cx="-0.0" cy="-28.0" r="10" fill="#7cbf62" opacity="0.76"/><circle cx="29.5" cy="-37.9" r="13" fill="#551d12" opacity="0.76"/><circle cx="70.0" cy="-38.2" r="16" fill="#d33b21" opacity="0.76"/><circle cx="111.8" cy="-10.7" r="19" fill="#f7f0dc" opacity="0.76"/>
      <path d="M-130 -28 C-80 -58, -35 -52, 16 -42 C78 -29, 112 -50, 145 -20" fill="none" stroke="#fff1c9" stroke-width="16" opacity="0.42" stroke-linecap="round"/>
