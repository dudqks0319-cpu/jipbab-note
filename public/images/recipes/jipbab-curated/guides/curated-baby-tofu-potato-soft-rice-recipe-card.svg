<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">후기 두부감자진밥 레시피 이미지</title>
  <desc id="desc">후기 두부감자진밥 재료와 조리 순서를 요약한 집밥노트 레시피 카드</desc>
  <defs>
    <clipPath id="photoClip"><rect x="60" y="70" width="460" height="460" rx="34"/></clipPath>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6e431d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#fbf6ee"/>
  <rect x="38" y="42" width="1004" height="1266" rx="42" fill="#fffaf3" stroke="#eadcc9" stroke-width="3" filter="url(#softShadow)"/>
  <image href="/images/recipes/jipbab-curated/baby-tofu-potato-soft-rice.png" x="60" y="70" width="460" height="460" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  <rect x="60" y="70" width="460" height="460" rx="34" fill="none" stroke="#eadcc9" stroke-width="3"/>

  <text x="565" y="112" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="26" font-weight="900" fill="#d94d19">집밥노트 레시피</text>
  <text x="565" y="174" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="62" font-weight="900" fill="#2f2117">후기 두부감자진밥</text>
  <rect x="565" y="320" width="112" height="42" rx="21" fill="#fff0e4"/>
  <text x="621" y="349" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#d94d19">이유식</text>
  <rect x="692" y="320" width="112" height="42" rx="21" fill="#eef4ff"/>
  <text x="748" y="349" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#2f6fec">끓이기</text>
  <rect x="819" y="320" width="128" height="42" rx="21" fill="#eef6df"/>
  <text x="883" y="349" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#3d7b38">28분</text>
  <text x="565" y="414" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="25" font-weight="700" fill="#6e5a49">후기는 하루 3회 식사 리듬과 씹는 연습이</text>
<text x="565" y="448" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="25" font-weight="700" fill="#6e5a49">중요합니다. 두부는 알레르기 표시 식품이므로</text>
<text x="565" y="482" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="25" font-weight="700" fill="#6e5a49">처음이라면 소량부터 확인하세요.</text>

  <text x="78" y="615" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="34" font-weight="900" fill="#2f2117">재료</text>
  <rect x="78" y="636" width="420" height="46" rx="23" fill="#fff7ed"/>
    <text x="102" y="667" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">쌀</text>
    <text x="474" y="667" text-anchor="end" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#d94d19">불린 쌀 40g</text>
<rect x="78" y="694" width="420" height="46" rx="23" fill="#fff7ed"/>
    <text x="102" y="725" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">두부</text>
    <text x="474" y="725" text-anchor="end" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#d94d19">25g</text>
<rect x="78" y="752" width="420" height="46" rx="23" fill="#fff7ed"/>
    <text x="102" y="783" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">감자</text>
    <text x="474" y="783" text-anchor="end" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#d94d19">25g</text>
<rect x="78" y="810" width="420" height="46" rx="23" fill="#fff7ed"/>
    <text x="102" y="841" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">양파</text>
    <text x="474" y="841" text-anchor="end" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#d94d19">10g</text>

  <text x="555" y="615" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="34" font-weight="900" fill="#2f2117">순서</text>
  <circle cx="586" cy="656" r="24" fill="#6e431d"/>
    <text x="586" y="664" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#ffffff">1</text>
    <text x="630" y="654" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">재료를 아기 단계에 맞게 아주 작고 부드럽게</text>
<text x="630" y="685" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">준비합니다.</text>
<circle cx="586" cy="788" r="24" fill="#6e431d"/>
    <text x="586" y="796" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#ffffff">2</text>
    <text x="630" y="786" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">약불에서 눌어붙지 않게 저어가며 충분히</text>
<text x="630" y="817" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">익힙니다.</text>
<circle cx="586" cy="920" r="24" fill="#6e431d"/>
    <text x="586" y="928" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#ffffff">3</text>
    <text x="630" y="918" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">입자와 농도를 맞춘 뒤 덩어리가 큰지</text>
<text x="630" y="949" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">확인합니다.</text>
<circle cx="586" cy="1052" r="24" fill="#6e431d"/>
    <text x="586" y="1060" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="22" font-weight="900" fill="#ffffff">4</text>
    <text x="630" y="1050" text-anchor="start" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="23" font-weight="800" fill="#4b3929">미지근하게 식혀 소량부터 천천히 제공합니다.</text>

  <rect x="78" y="1185" width="924" height="72" rx="28" fill="#2f2117"/>
  <text x="540" y="1231" text-anchor="middle" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="25" font-weight="900" fill="#ffe7c9">씹는 연습을 시작하는 후기용 부드러운 진밥</text>
</svg>
