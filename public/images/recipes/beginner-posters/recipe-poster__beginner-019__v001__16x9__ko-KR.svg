<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">주먹밥 집밥노트 초보자 레시피 포스터</title>
  <desc id="desc">주먹밥은 6분 안에 만들 수 있는 초보자용 집밥 메뉴입니다. 재료, 도구, 조리 순서, 복구 팁을 한 장에 정리한 자체 제작 이미지입니다.</desc>
  <rect width="1600" height="900" fill="#fff8ef" />
  <rect x="22" y="22" width="1556" height="856" rx="36" fill="#fffdf8" stroke="#ead7c6" stroke-width="3" />

  <g>
    <rect x="48" y="58" width="485" height="405" rx="30" fill="#ffe2d5" />
    <circle cx="291" cy="246" r="142" fill="#ffffff" opacity="0.92" />
    <ellipse cx="291" cy="271" rx="168" ry="92" fill="#e85d35" opacity="0.86" />
    <ellipse cx="291" cy="246" rx="142" ry="73" fill="#fff4d9" opacity="0.95" />
    <circle cx="248" cy="229" r="19" fill="#6b2418" opacity="0.35" />
    <circle cx="304" cy="258" r="16" fill="#6b2418" opacity="0.30" />
    <circle cx="353" cy="231" r="21" fill="#ffffff" opacity="0.65" />
    <path d="M173 170 C239 117, 346 118, 416 169" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55" />
    <text x="80" y="115" font-size="56" font-weight="950" fill="#6b2418">주먹밥</text>
    <text x="82" y="164" font-size="24" font-weight="800" fill="#513f34">주먹밥은 6분 안에 만들 수 있는</text>
<text x="82" y="194" font-size="24" font-weight="800" fill="#513f34"> 초보자용 집밥 메뉴입니다.</text>
    
  <rect x="82" y="398" width="118" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="141" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#6b2418">6분</text>

    
  <rect x="215" y="398" width="128" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="279" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#6b2418">처음 요리 추천</text>

    
  <rect x="358" y="398" width="136" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="426" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#6b2418">1인분</text>

  </g>

  <text x="580" y="93" font-size="36" font-weight="950" fill="#2a211a">1. 재료 준비</text>
  <text x="1225" y="93" font-size="36" font-weight="950" fill="#2a211a">2. 조리도구</text>
  
    <g>
      <rect x="595" y="160" width="134" height="92" rx="18" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="627" cy="191" r="18" fill="#ffe2d5" stroke="#e85d35" stroke-width="3" />
      <path d="M618 193 C623 184, 635 184, 638 193 C634 203, 622 203, 618 193Z" fill="#e85d35" opacity="0.72" />
      <text x="662" y="194" text-anchor="middle" font-size="19" font-weight="900" fill="#6b2418">밥</text>
      <text x="662" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">1공기</text>
    </g>
  

    <g>
      <rect x="749" y="160" width="134" height="92" rx="18" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="781" cy="191" r="18" fill="#ffe2d5" stroke="#e85d35" stroke-width="3" />
      <path d="M772 193 C777 184, 789 184, 792 193 C788 203, 776 203, 772 193Z" fill="#e85d35" opacity="0.72" />
      <text x="816" y="194" text-anchor="middle" font-size="19" font-weight="900" fill="#6b2418">간장</text>
      <text x="816" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">1큰술</text>
    </g>
  
  
    <g>
      <rect x="1225" y="160" width="270" height="55" rx="16" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="1256" cy="187" r="14" fill="#ffe2d5" stroke="#e85d35" stroke-width="3" />
      <text x="1283" y="195" font-size="21" font-weight="850" fill="#6b2418">그릇</text>
    </g>
  

    <g>
      <rect x="1225" y="233" width="270" height="55" rx="16" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="1256" cy="260" r="14" fill="#ffe2d5" stroke="#e85d35" stroke-width="3" />
      <text x="1283" y="268" font-size="21" font-weight="850" fill="#6b2418">숟가락</text>
    </g>
  

  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 가장 두꺼운 재료가 차갑지 않고 젓가락이나 숟가락으로 쉽게 나뉩니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#e85d35" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#6b2418">재료 꺼내기</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">주먹밥에 쓸 재료를 꺼내 물기나 기름기를 먼저</text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 빼 주세요.</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#e85d35" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#6b2418">양념 넣기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">간장이나 참기름은 한 번에 많이 넣지 말고 표</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038">시된 양의 절반부터 넣습니다.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#e85d35" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#6b2418">살살 섞기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">숟가락 두 개나 젓가락으로 아래에서 위로 들어</text>
<text x="1141" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 올리듯 섞습니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="48" y="663" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="703" r="25" fill="#e85d35" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#6b2418">맛 확인</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">한 숟가락 맛보고 싱거우면 간장 1작은술만 더</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038"> 넣습니다.</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 물기가 많으면 키친타월이나 체로 한 번 더 빼 주세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
    <text x="817" y="841" font-size="20" font-weight="900" fill="#6f4c20">집밥노트 자체 제작 · 외부 사진/캐릭터/브랜드 미사용</text>
  </g>
</svg>
