  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 양배추가 부드럽지만 완전히 흐물거리지는 않습니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#e85d35" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#6b2418">재료 준비</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">밥 1공기를 그릇에 담고 양배추 2줌은 얇게 </text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038">썰거나 채 썬 제품을 준비합니다. 계란 2개는</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 3분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#e85d35" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#6b2418">양배추 볶기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">팬에 식용유 1큰술을 두르고 중불에서 양배추를</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 3분 볶습니다.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">중불 · 3분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#e85d35" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#6b2418">계란 넣기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">풀어 둔 계란을 양배추 위에 붓고 젓가락으로 </text>
<text x="1141" y="607.5" font-size="18" font-weight="700" fill="#4b4038">크게 저어 부드럽게 익힙니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">중약불 · 2분</text>
    </g>
  

    <g>
      <rect x="48" y="663" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="703" r="25" fill="#e85d35" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#6b2418">밥 위에 올리기</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">간장 1큰술을 팬 가장자리에 넣어 섞고 밥 위</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038">에 올립니다. 참기름이 있으면 불을 끄고 1작</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 두꺼우면 가위로 한 번 더 잘라 주세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
