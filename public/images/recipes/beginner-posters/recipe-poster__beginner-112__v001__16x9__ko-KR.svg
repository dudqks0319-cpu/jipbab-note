<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">양배추계란덮밥 집밥노트 초보자 레시피 포스터</title>
  <desc id="desc">양배추계란덮밥 레시피는 10분 안에 만들 수 있는 초보자용 집밥 메뉴입니다. 재료, 도구, 조리 순서, 복구 팁을 한 장에 정리한 자체 제작 이미지입니다.</desc>
  <rect width="1600" height="900" fill="#fff8ef" />
  <rect x="22" y="22" width="1556" height="856" rx="36" fill="#fffdf8" stroke="#ead7c6" stroke-width="3" />

  <g>
    <rect x="48" y="58" width="485" height="405" rx="30" fill="#ffe2d5" />
    <circle cx="291" cy="246" r="142" fill="#ffffff" opacity="0.92" />
