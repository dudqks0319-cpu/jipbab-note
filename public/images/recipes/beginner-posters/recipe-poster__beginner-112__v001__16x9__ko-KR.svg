    <text x="82" y="164" font-size="24" font-weight="800" fill="#513f34">양배추계란덮밥 레시피는 10분 안</text>
<text x="82" y="194" font-size="24" font-weight="800" fill="#513f34">에 만들 수 있는 초보자용 집밥 </text>
<text x="82" y="224" font-size="24" font-weight="800" fill="#513f34">메뉴입니다.</text>
    
  <rect x="82" y="398" width="118" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="141" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#6b2418">10분</text>

    
  <rect x="215" y="398" width="128" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
