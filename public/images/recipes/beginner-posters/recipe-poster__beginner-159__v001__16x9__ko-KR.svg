  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 가장 두꺼운 재료가 차갑지 않고 젓가락이나 숟가락으로 쉽게 나뉩니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#4fba9a" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#173d34">양배추 계란물 만들기</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">그릇에 계란 1개를 풀고 채 썬 양배추 1줌,</text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 소금 한 꼬집을 섞습니다.</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#4fba9a" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#173d34">속재료 부치기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">팬에 식용유 1작은술을 두르고 양배추 계란물을</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 약불에서 앞뒤로 2분씩 굽습니다.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">약불 · 4분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#4fba9a" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#173d34">식빵 굽기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">같은 팬에 식빵 2장을 앞뒤로 30초씩 살짝 </text>
<text x="1141" y="607.5" font-size="18" font-weight="700" fill="#4b4038">굽습니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">약불 · 2분</text>
    </g>
  

    <g>
