      <circle cx="90" cy="703" r="25" fill="#4fba9a" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#173d34">샌드하기</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">식빵에 케첩과 마요네즈를 바르고 양배추 계란을</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038"> 끼워 반으로 자릅니다.</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 두껍게 썰었다면 가위로 그릇 안에서 한 번 더 자르세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
