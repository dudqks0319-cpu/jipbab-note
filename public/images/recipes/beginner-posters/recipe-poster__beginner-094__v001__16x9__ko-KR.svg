      <circle cx="1089" cy="191" r="18" fill="#f0e8ff" stroke="#8d6ad8" stroke-width="3" />
      <path d="M1080 193 C1085 184, 1097 184, 1100 193 C1096 203, 1084 203, 1080 193Z" fill="#8d6ad8" opacity="0.72" />
      <text x="1124" y="194" text-anchor="middle" font-size="19" font-weight="900" fill="#39245f">간장</text>
      <text x="1124" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">1큰술</text>
    </g>
  

    <g>
      <rect x="595" y="275" width="134" height="92" rx="18" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="627" cy="306" r="18" fill="#f0e8ff" stroke="#8d6ad8" stroke-width="3" />
      <path d="M618 308 C623 299, 635 299, 638 308 C634 318, 622 318, 618 308Z" fill="#8d6ad8" opacity="0.72" />
      <text x="662" y="309" text-anchor="middle" font-size="19" font-weight="900" fill="#39245f">참기름</text>
      <text x="662" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">1작은술</text>
    </g>
  
  
    <g>
