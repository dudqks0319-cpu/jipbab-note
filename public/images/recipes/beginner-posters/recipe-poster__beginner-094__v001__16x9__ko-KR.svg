      <text x="1283" y="268" font-size="21" font-weight="850" fill="#39245f">전자레인지용 그릇</text>
    </g>
  

    <g>
      <rect x="1225" y="306" width="270" height="55" rx="16" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="1256" cy="333" r="14" fill="#f0e8ff" stroke="#8d6ad8" stroke-width="3" />
      <text x="1283" y="341" font-size="21" font-weight="850" fill="#39245f">숟가락</text>
    </g>
  

  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 계란물이 흐르지 않고 밥알 사이에 계란과 햄이 고르게 섞였습니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#8d6ad8" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#39245f">계란 풀기</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">전자레인지용 그릇에 계란 2개를 깨고 노른자와</text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 흰자가 섞이도록 완전히 풀어 줍니다.</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#8d6ad8" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#39245f">밥과 햄 섞기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">밥 1공기와 잘게 자른 햄을 넣고 계란물과 골</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038">고루 섞습니다.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#8d6ad8" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#39245f">덮고 돌리기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">뚜껑이나 랩을 한쪽 열어 덮고 전자레인지에 1</text>
<text x="1141" y="607.5" font-size="18" font-weight="700" fill="#4b4038">분 30초 돌린 뒤 한 번 섞습니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="48" y="663" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="703" r="25" fill="#8d6ad8" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#39245f">간장참기름 마무리</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">계란이 익으면 간장 1큰술과 참기름 1작은술을</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038"> 넣고 비벼 1분 식힙니다.</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 노른자는 반드시 젓가락으로 터뜨리고 섞으세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
    <text x="817" y="841" font-size="20" font-weight="900" fill="#6f4c20">집밥노트 자체 제작 · 외부 사진/캐릭터/브랜드 미사용</text>
