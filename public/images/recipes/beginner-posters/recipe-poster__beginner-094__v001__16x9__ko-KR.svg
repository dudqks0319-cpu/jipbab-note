<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">전자레인지 햄계란밥 집밥노트 초보자 레시피 포스터</title>
  <desc id="desc">전자레인지 햄계란밥 레시피는 8분 안에 만들 수 있는 초보자용 집밥 메뉴입니다. 재료, 도구, 조리 순서, 복구 팁을 한 장에 정리한 자체 제작 이미지입니다.</desc>
  <rect width="1600" height="900" fill="#fff8ef" />
  <rect x="22" y="22" width="1556" height="856" rx="36" fill="#fffdf8" stroke="#ead7c6" stroke-width="3" />

  <g>
    <rect x="48" y="58" width="485" height="405" rx="30" fill="#f0e8ff" />
    <circle cx="291" cy="246" r="142" fill="#ffffff" opacity="0.92" />
    <ellipse cx="291" cy="271" rx="168" ry="92" fill="#8d6ad8" opacity="0.86" />
    <ellipse cx="291" cy="246" rx="142" ry="73" fill="#fff4d9" opacity="0.95" />
    <circle cx="248" cy="229" r="19" fill="#39245f" opacity="0.35" />
    <circle cx="304" cy="258" r="16" fill="#39245f" opacity="0.30" />
    <circle cx="353" cy="231" r="21" fill="#ffffff" opacity="0.65" />
    <path d="M173 170 C239 117, 346 118, 416 169" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55" />
    <text x="80" y="115" font-size="56" font-weight="950" fill="#39245f">전자레인지 햄계란밥</text>
    <text x="82" y="164" font-size="24" font-weight="800" fill="#513f34">전자레인지 햄계란밥 레시피는 8분</text>
<text x="82" y="194" font-size="24" font-weight="800" fill="#513f34"> 안에 만들 수 있는 초보자용 집</text>
<text x="82" y="224" font-size="24" font-weight="800" fill="#513f34">밥 메뉴입니다.</text>
    
  <rect x="82" y="398" width="118" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="141" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#39245f">8분</text>

    
  <rect x="215" y="398" width="128" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="279" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#39245f">처음 요리 추천</text>

    
  <rect x="358" y="398" width="136" height="42" rx="21" fill="#ffffff" stroke="#e2c6ad" />
  <text x="426" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#39245f">2인분</text>

  </g>

  <text x="580" y="93" font-size="36" font-weight="950" fill="#2a211a">1. 재료 준비</text>
  <text x="1225" y="93" font-size="36" font-weight="950" fill="#2a211a">2. 조리도구</text>
  
    <g>
      <rect x="595" y="160" width="134" height="92" rx="18" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="627" cy="191" r="18" fill="#f0e8ff" stroke="#8d6ad8" stroke-width="3" />
      <path d="M618 193 C623 184, 635 184, 638 193 C634 203, 622 203, 618 193Z" fill="#8d6ad8" opacity="0.72" />
