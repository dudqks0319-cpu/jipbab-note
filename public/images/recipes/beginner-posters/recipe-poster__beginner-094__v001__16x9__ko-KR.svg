      <circle cx="1256" cy="187" r="14" fill="#f0e8ff" stroke="#8d6ad8" stroke-width="3" />
      <text x="1283" y="195" font-size="21" font-weight="850" fill="#39245f">전자레인지</text>
    </g>
  

    <g>
      <rect x="1225" y="233" width="270" height="55" rx="16" fill="#fffaf4" stroke="#ead7c6" />
