      <text x="970" y="194" text-anchor="middle" font-size="19" font-weight="900" fill="#5b2017">물</text>
      <text x="970" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">2.5컵</text>
    </g>
  
  
    <g>
