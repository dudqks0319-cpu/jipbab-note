      <text x="662" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#735f50">2장</text>
    </g>
  

    <g>
      <rect x="749" y="160" width="134" height="92" rx="18" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="781" cy="191" r="18" fill="#ffe6d9" stroke="#d94b2b" stroke-width="3" />
      <path d="M772 193 C777 184, 789 184, 792 193 C788 203, 776 203, 772 193Z" fill="#d94b2b" opacity="0.72" />
