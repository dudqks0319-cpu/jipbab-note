  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 배추 줄기가 반투명하고 잎이 부드럽게 익었습니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#d94b2b" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#5b2017">배추 자르기</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">배추 2장은 잎과 줄기를 한입 크기로 자릅니다</text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038">.</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 3분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#d94b2b" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#5b2017">된장 풀기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">냄비에 물 2.5컵과 된장 1큰술을 넣고 숟가</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038">락으로 풀어 중불에 올립니다.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">중불 · 3분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#d94b2b" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#5b2017">배추 끓이기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">배추를 넣고 중불에서 8분 끓입니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">중불 · 8분</text>
    </g>
  

    <g>
      <rect x="48" y="663" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="703" r="25" fill="#d94b2b" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#5b2017">간 보고 완성</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">국물을 맛보고 싱거우면 된장 1작은술만 더 풀</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038">고 대파가 있으면 올립니다.</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">약불 · 1분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 큰 줄기는 반으로 더 자르세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
    <text x="817" y="841" font-size="20" font-weight="900" fill="#6f4c20">집밥노트 자체 제작 · 외부 사진/캐릭터/브랜드 미사용</text>
  </g>
