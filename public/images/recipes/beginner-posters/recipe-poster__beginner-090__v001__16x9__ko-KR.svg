      <circle cx="1256" cy="260" r="14" fill="#ffe6d9" stroke="#d94b2b" stroke-width="3" />
      <text x="1283" y="268" font-size="21" font-weight="850" fill="#5b2017">국자</text>
    </g>
  

    <g>
      <rect x="1225" y="306" width="270" height="55" rx="16" fill="#fffaf4" stroke="#ead7c6" />
      <circle cx="1256" cy="333" r="14" fill="#ffe6d9" stroke="#d94b2b" stroke-width="3" />
      <text x="1283" y="341" font-size="21" font-weight="850" fill="#5b2017">그릇</text>
    </g>
  

  <rect x="580" y="400" width="915" height="63" rx="20" fill="#fff2da" stroke="#ead7c6" />
  <text x="606" y="440" font-size="22" font-weight="850" fill="#5a483c">눈으로 확인: 소면이 차갑고 서로 뭉치지 않으며 육수에 반쯤 잠겨 있습니다.</text>

  <text x="48" y="496" font-size="38" font-weight="950" fill="#2a211a">3. 조리 순서</text>
  
    <g>
      <rect x="48" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="555" r="25" fill="#d94b2b" />
      <text x="90" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">1</text>
      <text x="131" y="551" font-size="24" font-weight="950" fill="#5b2017">소면 삶기</text>
      <text x="131" y="585" font-size="18" font-weight="700" fill="#4b4038">냄비에 물을 넉넉히 끓이고 소면 1인분을 포장</text>
<text x="131" y="607.5" font-size="18" font-weight="700" fill="#4b4038"> 시간대로 삶습니다.</text>
      <text x="388" y="618" font-size="17" font-weight="850" fill="#7f6b5b">중불 · 4분</text>
    </g>
  

    <g>
      <rect x="553" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="595" cy="555" r="25" fill="#d94b2b" />
      <text x="595" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">2</text>
      <text x="636" y="551" font-size="24" font-weight="950" fill="#5b2017">찬물에 헹구기</text>
      <text x="636" y="585" font-size="18" font-weight="700" fill="#4b4038">삶은 면을 체에 밭쳐 찬물로 2번 헹구고 손으</text>
<text x="636" y="607.5" font-size="18" font-weight="700" fill="#4b4038">로 가볍게 비벼 전분기를 빼세요.</text>
      <text x="893" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 2분</text>
    </g>
  

    <g>
      <rect x="1058" y="515" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="1100" cy="555" r="25" fill="#d94b2b" />
      <text x="1100" y="564" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">3</text>
      <text x="1141" y="551" font-size="24" font-weight="950" fill="#5b2017">육수 붓기</text>
      <text x="1141" y="585" font-size="18" font-weight="700" fill="#4b4038">그릇에 면을 담고 차가운 냉면육수 1봉을 붓습</text>
<text x="1141" y="607.5" font-size="18" font-weight="700" fill="#4b4038">니다.</text>
      <text x="1398" y="618" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

    <g>
      <rect x="48" y="663" width="465" height="125" rx="22" fill="#fffdf8" stroke="#ead7c6" />
      <circle cx="90" cy="703" r="25" fill="#d94b2b" />
      <text x="90" y="712" text-anchor="middle" font-size="28" font-weight="950" fill="#ffffff">4</text>
      <text x="131" y="699" font-size="24" font-weight="950" fill="#5b2017">고명 올리기</text>
      <text x="131" y="733" font-size="18" font-weight="700" fill="#4b4038">오이나 참깨가 있으면 올리고 한입 맛본 뒤 싱</text>
<text x="131" y="755.5" font-size="18" font-weight="700" fill="#4b4038">거우면 간장 1작은술만 더합니다.</text>
      <text x="388" y="766" font-size="17" font-weight="850" fill="#7f6b5b">불 없음 · 1분</text>
    </g>
  

  <g>
    <rect x="48" y="810" width="720" height="48" rx="18" fill="#f6fbf0" stroke="#d6e7c9" />
    <text x="75" y="841" font-size="20" font-weight="900" fill="#456b2c">망했어요? 조금 단단하면 30초만 더 삶으세요.</text>
    <rect x="790" y="810" width="760" height="48" rx="18" fill="#fff7e8" stroke="#ead7c6" />
    <text x="817" y="841" font-size="20" font-weight="900" fill="#6f4c20">집밥노트 자체 제작 · 외부 사진/캐릭터/브랜드 미사용</text>
  </g>
