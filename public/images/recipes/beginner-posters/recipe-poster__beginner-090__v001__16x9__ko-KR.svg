      <circle cx="1256" cy="187" r="14" fill="#ffe6d9" stroke="#d94b2b" stroke-width="3" />
      <text x="1283" y="195" font-size="21" font-weight="850" fill="#5b2017">냄비</text>
    </g>
  

    <g>
