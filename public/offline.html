<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ee" />
    <title>오프라인 · 집밥노트</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf6ee; color: #3f3025; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      main { width: min(100% - 32px, 390px); border: 1px solid #eadcc9; border-radius: 24px; background: #fffdf9; padding: 28px 22px; box-shadow: 0 18px 48px rgba(63, 48, 37, .12); }
      .label { color: #d85b24; font-size: 12px; font-weight: 900; }
      h1 { margin: 10px 0 0; font-size: 26px; line-height: 1.3; }
      p { margin: 14px 0 0; color: #74675b; font-size: 15px; font-weight: 650; line-height: 1.7; word-break: keep-all; }
      a { margin-top: 22px; min-height: 52px; display: inline-flex; width: 100%; align-items: center; justify-content: center; border-radius: 15px; background: #ea5a1f; color: #fff; font-size: 15px; font-weight: 900; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">집밥노트 오프라인</div>
      <h1>열어본 레시피를 찾지 못했어요</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요. 한 번 정상적으로 연 공개 레시피는 다음 오프라인 조리부터 이어 볼 수 있어요.</p>
      <a href="">네트워크 다시 확인</a>
    </main>
  </body>
</html>
